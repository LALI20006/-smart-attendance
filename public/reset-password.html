<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AttendPro — Reset Password</title>
  <style>
    :root {
      --bg: #0f1125;
      --panel: rgba(24, 27, 52, 0.9);
      --panel-border: rgba(255,255,255,0.08);
      --primary: #6f7cff;
      --primary-2: #9b5de5;
      --text: #edf2ff;
      --muted: #b6bdd8;
      --danger: #ff5b79;
      --success: #00d4a1;
      --input: rgba(117, 124, 171, 0.14);
      --shadow: rgba(15, 17, 37, 0.45);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, rgba(95, 96, 244, 0.28), transparent 30%),
                  radial-gradient(circle at bottom right, rgba(255, 98, 140, 0.18), transparent 25%),
                  var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .reset-card {
      width: min(100%, 520px);
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 24px;
      box-shadow: 0 24px 60px var(--shadow);
      padding: 28px 28px 22px;
    }

    .title {
      margin: 0 0 18px;
      font-size: clamp(28px, 3vw, 40px);
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon {
      width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(255,180,71,0.25), rgba(255,120,85,0.2));
      font-size: 22px;
    }

    .subtitle {
      color: var(--muted);
      margin: 0 0 20px;
      line-height: 1.6;
      font-size: 15px;
    }

    .field {
      margin-bottom: 18px;
    }

    .token-box {
      display: none;
      margin-bottom: 18px;
    }

    .token-box.visible {
      display: block;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .input-wrap {
      display: flex;
      align-items: center;
      border: 1px solid rgba(255,255,255,0.08);
      background: var(--input);
      border-radius: 12px;
      overflow: hidden;
      min-height: 52px;
    }

    input {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--text);
      padding: 14px 14px;
      font-size: 16px;
      outline: none;
    }

    .eye {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 18px;
      cursor: pointer;
      padding: 0 14px;
    }

    .error {
      display: none;
      background: rgba(255, 91, 121, 0.15);
      border: 1px solid rgba(255, 91, 121, 0.5);
      color: #ffafbb;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14px;
      margin: 12px 0 18px;
    }

    .error.visible { display: block; }

    .success {
      display: none;
      background: rgba(0, 212, 161, 0.12);
      border: 1px solid rgba(0, 212, 161, 0.45);
      color: #baf7eb;
      border-radius: 12px;
      padding: 12px 14px;
      margin: 12px 0 18px;
    }

    .success.visible { display: block; }

    button {
      width: 100%;
      border: none;
      border-radius: 14px;
      background: linear-gradient(90deg, var(--primary), var(--primary-2));
      color: white;
      padding: 16px 18px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 12px 28px rgba(111, 124, 255, 0.38);
    }

    button[disabled] {
      opacity: 0.7;
      cursor: wait;
    }

    .inline-link {
      margin-top: 16px;
      text-align: center;
    }

    a {
      color: #b8c1ff;
      text-decoration: none;
      font-weight: 700;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="reset-card">
    <h1 class="title"><span class="icon">🔐</span> Reset Password</h1>
    <p class="subtitle">Create a strong new password for your AttendPro account.</p>

    <div id="error-box" class="error"></div>
    <div id="success-box" class="success">Your password has been updated successfully. You can now sign in with your new password.</div>

    <form id="reset-form">
      <div class="field token-box" id="token-box">
        <label for="reset-token">Reset Token</label>
        <div class="input-wrap">
          <input id="reset-token" type="text" placeholder="Paste the token from your email" />
        </div>
      </div>

      <div class="field">
        <label for="new-password">New Password</label>
        <div class="input-wrap">
          <input id="new-password" type="password" placeholder="Enter new password" required />
          <button type="button" class="eye" id="toggle-new">👁️</button>
        </div>
      </div>

      <div class="field">
        <label for="confirm-password">Confirm Password</label>
        <div class="input-wrap">
          <input id="confirm-password" type="password" placeholder="Confirm new password" required />
          <button type="button" class="eye" id="toggle-confirm">👁️</button>
        </div>
      </div>

      <button id="submit-btn" type="submit">Update Password</button>
    </form>

    <div class="inline-link">
      <a href="/index.html">Back to sign in</a>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const urlToken = params.get('token');
    const savedToken = localStorage.getItem('attendx_reset_token');
    const form = document.getElementById('reset-form');
    const errorBox = document.getElementById('error-box');
    const successBox = document.getElementById('success-box');
    const submitBtn = document.getElementById('submit-btn');
    const tokenBox = document.getElementById('token-box');
    const tokenInput = document.getElementById('reset-token');
    const token = urlToken || savedToken || '';

    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.add('visible');
      successBox.classList.remove('visible');
    }

    function hideError() {
      errorBox.textContent = '';
      errorBox.classList.remove('visible');
    }

    function showSuccess() {
      successBox.classList.add('visible');
      form.classList.add('hidden');
    }

    function bindEyeToggle(buttonId, inputId) {
      document.getElementById(buttonId).addEventListener('click', () => {
        const input = document.getElementById(inputId);
        const isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';
        document.getElementById(buttonId).textContent = isPassword ? '🙈' : '👁️';
      });
    }

    bindEyeToggle('toggle-new', 'new-password');
    bindEyeToggle('toggle-confirm', 'confirm-password');

    if (!token) {
      tokenBox.classList.add('visible');
      showError('Reset token is missing. Please paste the token from your email or request a new reset link.');
    } else {
      localStorage.setItem('attendx_reset_token', token);
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      hideError();

      const effectiveToken = (urlToken || savedToken || tokenInput.value || '').trim();
      if (!effectiveToken) {
        tokenBox.classList.add('visible');
        showError('Reset token is missing. Please paste the token from your email or request a new reset link.');
        return;
      }

      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (!newPassword || !confirmPassword) {
        showError('Please enter and confirm your new password.');
        return;
      }

      if (newPassword.length < 6) {
        showError('Password must be at least 6 characters long.');
        return;
      }

      if (newPassword !== confirmPassword) {
        showError('Passwords do not match.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Updating...';

      try {
        const response = await fetch('/api/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: effectiveToken, password: newPassword })
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(data.error || 'Unable to reset password.');
        }

        localStorage.removeItem('attendx_reset_token');
        showSuccess();
      } catch (err) {
        showError(err.message || 'Unable to reset password.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Update Password';
      }
    });
  </script>
</body>
</html>
