services:
  - type: web
    name: smart-attendance-platform
    env: node
    plan: free
    region: oregon
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        value: "https://attendence.in.com"
      - key: CORS_ORIGIN
        value: "https://attendence.in.com,https://www.attendence.in.com,https://api.attendence.in.com"
      - key: DATABASE_URL
        sync: false
