<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Logs - AttendPro</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      padding: 2rem;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .logs-container {
      max-width: 800px;
      margin: 0 auto;
      background: var(--bg-elevated);
      border-radius: var(--radius-lg);
      padding: 2rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      border: 1px solid var(--border-default);
    }
    h1 {
      margin-top: 0;
      color: var(--primary-light);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid var(--border-subtle);
    }
    th {
      font-weight: 600;
      color: var(--text-muted);
    }
    tr:hover {
      background: rgba(255, 255, 255, 0.02);
    }
    .role-badge {
      padding: 4px 8px;
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
    }
    .role-student { background: rgba(108, 99, 255, 0.2); color: #8c83ff; }
    .role-faculty { background: rgba(0, 212, 161, 0.2); color: #00d4a1; }
  </style>
</head>
<body>

  <div class="logs-container">
    <h1>System Login Logs</h1>
    <p>History of all users who have signed into the system.</p>

    <table>
      <thead>
        <tr>
          <th>Date & Time</th>
          <th>Email Address</th>
          <th>Role</th>
        </tr>
      </thead>
      <tbody id="logs-body">
        <tr><td colspan="3">Loading logs...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    async function fetchLogs() {
      try {
        const res = await fetch('/api/login-logs');
        const data = await res.json();
        
        const tbody = document.getElementById('logs-body');
        tbody.innerHTML = '';
        
        if (!data.logs || data.logs.length === 0) {
          tbody.innerHTML = '<tr><td colspan="3">No logins found yet.</td></tr>';
          return;
        }

        data.logs.forEach(log => {
          const date = new Date(log.loggedInAt).toLocaleString();
          const roleClass = log.role === 'faculty' ? 'role-faculty' : 'role-student';
          
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${date}</td>
            <td><strong>${log.email}</strong></td>
            <td><span class="role-badge ${roleClass}">${log.role}</span></td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        document.getElementById('logs-body').innerHTML = '<tr><td colspan="3" style="color:red">Failed to load logs.</td></tr>';
      }
    }

    fetchLogs();
  </script>
</body>
</html>
